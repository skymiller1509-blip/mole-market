[package]
name = "mole-market"
version = "0.1.0"
description = "Mole Market - Among Us meets day trading on MagicBlock Ephemeral Rollups"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mole_market"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "=1.0.2"
# Pin every Anchor proc-macro crate to the same release: cargo otherwise
# resolves them to 1.2.x, whose generated code calls anchor-lang 1.2 APIs
# (e.g. system_program::create_account_allow_prefund) that 1.0.2 lacks.
anchor-attribute-access-control = "=1.0.2"
anchor-attribute-account = "=1.0.2"
anchor-attribute-constant = "=1.0.2"
anchor-attribute-error = "=1.0.2"
anchor-attribute-event = "=1.0.2"
anchor-attribute-program = "=1.0.2"
anchor-derive-accounts = "=1.0.2"
anchor-derive-serde = "=1.0.2"
anchor-derive-space = "=1.0.2"
anchor-syn = "=1.0.2"
ephemeral-rollups-sdk = { version = "0.18.0", features = ["anchor", "vrf"] }
sha2 = "0.10"

[dev-dependencies]
litesvm = "0.10.0"
ephemeral-rollups-sdk = { version = "0.18.0", features = ["anchor", "vrf"] }
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-instruction = "3"
solana-pubkey = "3"
solana-system-interface = "3"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
